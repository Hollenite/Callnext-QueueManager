name: Keep-alive

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Set the APP_URL repository variable to the production origin, e.g. https://your-app.vercel.app"
            exit 0
          fi
          curl -fsS "${APP_URL%/}/api/health"
